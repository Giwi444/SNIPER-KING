Name: BotHybrid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR=""
          while IFS= read -r file; do
            candidate="${file%/pubspec.yaml}"
            if [ -f "$candidate/lib/main.dart" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -not -path '*/.pub-cache/*' \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Cannot find Flutter project"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Generate Android platform with custom package name
        run: |
          cd "$PROJECT_DIR"
          flutter create . --platforms=android --org com.bothybrid --project-name bot_hybrid

      - name: Clean old build
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool
          rm -rf build

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Generate SNIPER HYBRID Robot Icon
        run: |
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons

      - name: Build fresh APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Rename APK to app-release.v2.apk
        run: |
          cd "$PROJECT_DIR"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release.v2.apk

      - name: Verify APK
        run: |
          test -f "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.v2.apk"
          ls -lh "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.v2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SniperHybridV2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.v2.apk
          if-no-files-found: error
