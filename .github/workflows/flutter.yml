name: BotHybrid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/pubspec.yaml}"
            if [ -f "$candidate/lib/main.dart" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -not -path '*/.pub-cache/*' \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Cannot find Flutter project."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Flutter project: $PROJECT_DIR"

      - name: Validate Flutter files
        run: |
          cd "$PROJECT_DIR"
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project files verified."

      - name: Clean old build
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build
          rm -rf android/.gradle android/app/build
          if [ -x android/gradlew ]; then
            cd android
            ./gradlew clean || true
          fi

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Diagnose old Android embedding
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== Searching Android v1 embedding references ==="
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            --exclude-dir=.gradle \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar|registerWith\(Registrar' \
            android lib pubspec.yaml pubspec.lock 2>/dev/null || true

          echo "=== Flutter dependency tree ==="
          flutter pub deps

      - name: Generate Launcher Icons
        run: |
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons || \
            echo "Launcher icon generation skipped."

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --no-shrink -v

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SniperHybridV2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
