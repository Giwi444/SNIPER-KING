
name: BotHybrid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/pubspec.yaml}"

            if [ -f "$candidate/lib/main.dart" ] && \
               [ -f "$candidate/android/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -not -path '*/.pub-cache/*' \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml

      - name: Repair Android v1 embedding
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          project = os.environ["PROJECT_DIR"]
          path = os.path.join(
              project, "android", "app", "src", "main",
              "AndroidManifest.xml"
          )

          ANDROID = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID)

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Manifest has no application element")

          name_key = f"{{{ANDROID}}}name"
          value_key = f"{{{ANDROID}}}value"

          if app.get(name_key) == "io.flutter.app.FlutterApplication":
              app.set(name_key, "${applicationName}")

          for activity in app.findall("activity"):
              if activity.get(name_key) == "io.flutter.app.FlutterActivity":
                  activity.set(name_key, ".MainActivity")

          metadata = None
          for item in app.findall("meta-data"):
              if item.get(name_key) == "flutterEmbedding":
                  metadata = item
                  break

          if metadata is None:
              metadata = ET.SubElement(app, "meta-data")
              metadata.set(name_key, "flutterEmbedding")

          metadata.set(value_key, "2")

          tree.write(path, encoding="utf-8", xml_declaration=True)

          print("Repaired manifest:", path)
          print("flutterEmbedding is set to 2")
          print("===== RESULTING MANIFEST =====")
          with open(path, encoding="utf-8") as manifest:
              print(manifest.read())
          PY

      - name: Clean old build
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build
          rm -rf android/.gradle android/app/build

      - name: Get dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Generate launcher icons
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons || \
            echo "Launcher icon generation skipped."

      - name: Build release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release --no-shrink -v

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SniperHybridV2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
