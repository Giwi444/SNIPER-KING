name: BotHybrid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/pubspec.yaml}"

            if [ -f "$candidate/lib/main.dart" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -not -path '*/.pub-cache/*' \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Cannot find Flutter project."
            echo "Check that pubspec.yaml and lib/main.dart exist."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Flutter project: $PROJECT_DIR"

      - name: Validate Flutter files
        run: |
          cd "$PROJECT_DIR"
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project files verified."

      - name: Generate Android platform
        run: |
          cd "$PROJECT_DIR"
          flutter create . \
            --platforms=android \
            --org com.bothybrid \
            --project-name bot_hybrid

      - name: Clean old build
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Setup launcher icons
        run: |
          cd "$PROJECT_DIR"
          dart pub add --dev flutter_launcher_icons

      - name: Generate SNIPER HYBRID Robot Icon
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if grep -q "flutter_launcher_icons:" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "No launcher icon configuration found."
            echo "Skipping icon generation."
          fi

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Rename APK
        run: |
          cd "$PROJECT_DIR"

          APK="build/app/outputs/flutter-apk/app-release.apk"
          NEW_APK="build/app/outputs/flutter-apk/app-release.v2.apk"

          test -f "$APK"
          mv "$APK" "$NEW_APK"

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.v2.apk"
          ls -lh "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.v2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SniperHybridV2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.v2.apk
          if-no-files-found: error
