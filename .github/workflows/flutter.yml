
name: BotHybrid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="${file%/pubspec.yaml}"

            if [ -f "$candidate/lib/main.dart" ] && \
               [ -f "$candidate/android/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -not -path '*/.pub-cache/*' \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          echo "Flutter project files verified."

      - name: Verify and repair Android embedding
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          if not path.is_file():
              raise SystemExit(f"ERROR: Manifest not found: {path}")

          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Manifest has no application element")

          name_key = android + "name"
          value_key = android + "value"

          if app.get(name_key) == "io.flutter.app.FlutterApplication":
              app.set(name_key, "${applicationName}")

          for activity in app.findall("activity"):
              if activity.get(name_key) == "io.flutter.app.FlutterActivity":
                  activity.set(name_key, ".MainActivity")

          for item in list(app.findall("meta-data")):
              if item.get(name_key) == "flutterEmbedding":
                  app.remove(item)

          metadata = ET.SubElement(app, "meta-data")
          metadata.set(name_key, "flutterEmbedding")
          metadata.set(value_key, "2")

          tree.write(path, encoding="utf-8", xml_declaration=True)

          check_root = ET.parse(path).getroot()
          check_app = check_root.find("application")

          if check_app is None:
              raise SystemExit("ERROR: Application element missing")

          valid = any(
              item.get(name_key) == "flutterEmbedding"
              and item.get(value_key) == "2"
              for item in check_app.findall("meta-data")
          )

          if not valid:
              raise SystemExit("ERROR: embedding v2 verification failed")

          if check_app.get(name_key) == "io.flutter.app.FlutterApplication":
              raise SystemExit("ERROR: Legacy FlutterApplication remains")

          print("SUCCESS: Android embedding v2 verified")
          print("===== MANIFEST USED FOR BUILD =====")
          print(path.resolve())
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Clean old build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build
          rm -rf android/.gradle android/app/build

      - name: Get dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Generate launcher icons
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons || {
            echo "WARNING: Launcher icon generation skipped."
          }

      - name: Final Android embedding check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(path).getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("ERROR: Application element missing")

          name_key = android + "name"
          value_key = android + "value"

          if app.get(name_key) == "io.flutter.app.FlutterApplication":
              raise SystemExit("ERROR: Legacy FlutterApplication remains")

          if any(
              item.get(name_key) == "io.flutter.app.FlutterActivity"
              for item in app.findall("activity")
          ):
              raise SystemExit("ERROR: Legacy FlutterActivity remains")

          valid = any(
              item.get(name_key) == "flutterEmbedding"
              and item.get(value_key) == "2"
              for item in app.findall("meta-data")
          )

          if not valid:
              raise SystemExit("ERROR: Embedding v2 metadata missing")

          print("SUCCESS: Final Android embedding check passed")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --no-shrink -v

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SniperHybridV2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
