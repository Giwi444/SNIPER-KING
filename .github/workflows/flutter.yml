name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android & Gradle structure if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=sniper_king
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-v2  # เปลี่ยนชื่อตรงนี้ไม่ให้ซ้ำกับรอบก่อนหน้า
          path: build/app/outputs/flutter-apk/app-release.apk
