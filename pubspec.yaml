name: sniperhybrid
description: "SNIPER HYBRID"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_database: ^11.3.0
  shared_preferences: 2.2.2
  cupertino_icons: ^1.0.8  
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  shared_preferences: 2.2.2
  shared_preferences_android: 2.2.2
  shared_preferences_platform_interface: 2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/1792250578954.jpg
    - assets/images/1792250396366.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/1792250578954.jpg"
